# Standalone environment for a NEW dedicated video channel/session.
# For an existing Daimon channel, merge packages into a copy of its current config
# and preserve its networking and other settings. Do not apply this as a replacement.
# Preserve claude-lock.json between standalone ant applies.
name: genjutsu-fal-cma
config:
  type: cloud
  packages:
    apt:
      - ffmpeg
      - rubberband-cli
      - ca-certificates
    pip:
      - fal-client==1.0.3
      - numpy==2.2.6
  networking:
    type: unrestricted
